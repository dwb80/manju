<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manju 开发就绪页面原型</title>
  <style>
    :root{color-scheme:dark;--bg:#111315;--panel:#1a1d20;--panel2:#22262a;--line:#343a40;--text:#f4f6f8;--muted:#9ba3aa;--accent:#10b981;--warn:#f59e0b;--danger:#ef4444;--info:#38bdf8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Noto Sans SC",system-ui,sans-serif}.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
    aside{border-right:1px solid var(--line);background:#151719;position:sticky;top:0;height:100vh;overflow:auto;padding:20px}.brand{font-size:18px;font-weight:800;margin-bottom:4px}.sub{color:var(--muted);font-size:12px;margin-bottom:18px}
    .search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);margin-bottom:12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}
    main{padding:26px 32px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.crumb{color:var(--muted);font-size:12px}.title{font-size:25px;font-weight:800;margin:4px 0}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.primary{border:0;background:var(--accent);color:#06291f;font-weight:800;padding:10px 16px;border-radius:8px}.statebar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.statebar button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 10px;border-radius:7px;cursor:pointer}.statebar button.active{border-color:var(--accent);color:var(--text)}
    .notice{display:none;padding:14px;border:1px solid var(--line);border-radius:9px;margin-bottom:16px}.notice.show{display:block}.notice.loading{border-color:var(--info);color:#bae6fd}.notice.empty{border-color:var(--line)}.notice.forbidden{border-color:var(--warn);color:#fde68a}.notice.conflict,.notice.error{border-color:var(--danger);color:#fecaca}
    .grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.panel h2{font-size:14px;margin:0 0 12px}.canvas{min-height:350px;background:linear-gradient(145deg,#252a2f,#171a1d);border:1px dashed #4b535b;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative;overflow:hidden}.safe{position:absolute;inset:13% 16%;border:1px dashed var(--accent);display:grid;place-items:center}.row{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #2c3136}.row:last-child{border:0}.label{color:var(--muted)}.value{min-height:28px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:12px}.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#163c31;color:#6ee7b7;font-size:12px}.footer{margin-top:18px;color:var(--muted);font-size:12px}
    @media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}main{padding:20px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Manju 页面原型</div>
    <div class="sub">P0/P1 信息架构 · 非视觉终稿</div>
    <input id="search" class="search" placeholder="筛选页面 / 功能 ID" aria-label="筛选页面">
    <nav id="nav" class="nav" aria-label="页面目录"></nav>
  </aside>
  <main>
    <div class="top">
      <div><div id="route" class="crumb"></div><div id="title" class="title"></div><div id="chips" class="chips"></div></div>
      <button id="primary" class="primary"></button>
    </div>
    <div class="statebar" aria-label="页面状态">
      <button data-state="loading">Loading</button><button data-state="empty">Empty</button><button data-state="ready" class="active">Ready</button><button data-state="forbidden">403</button><button data-state="conflict">409</button><button data-state="error">Error</button>
    </div>
    <div id="notice" class="notice"></div>
    <div class="grid">
      <section class="panel"><h2 id="mainHeading"></h2><div id="mainContent"></div></section>
      <section class="panel"><h2>字段 / 决策 / 约束</h2><div id="fields"></div></section>
      <section class="panel"><h2>关联 API</h2><div id="apis"></div></section>
      <section class="panel"><h2>交付状态检查</h2><div id="checks"></div></section>
    </div>
    <div class="footer">遵循 ui-design-improvement-spec；所有权限、状态转换和校验以服务端契约为准。</div>
  </main>
</div>
<script>
const pages=[
 {g:'身份与平台',n:'登录与会话安全',r:'/login · /account/security',f:['US-023'],role:'成员',a:'登录 / 撤销会话',api:['POST /api/v1/auth/login','GET /api/v1/auth/sessions','DELETE /api/v1/auth/sessions/{id}'],fields:['登录方式与失败锁定','活跃会话与设备摘要','改密后会话失效','SSO 回跳白名单']},
 {g:'身份与平台',n:'用户管理',r:'/admin/users',f:['US-022'],role:'platform_admin',a:'创建 / 邀请用户',api:['POST /api/v1/admin/users','POST /api/v1/admin/invitations','PATCH /api/v1/admin/users/{id}/status'],fields:['状态 invited/active/disabled/locked','系统角色','最后管理员保护','重新认证与审计']},
 {g:'身份与平台',n:'通知中心',r:'/notifications',f:['US-024'],role:'成员',a:'全部标为已读',api:['GET /api/v1/notifications','GET /api/v1/notifications/stream','POST /api/v1/notifications/read-batch'],fields:['SSE 断线补拉','未读/项目/类别筛选','目标无权时脱敏','强制安全通知']},
 {g:'身份与平台',n:'配置中心',r:'/admin/settings · /projects/{id}/settings',f:['US-026'],role:'admin / owner',a:'保存配置',api:['GET /api/v1/settings/effective','PUT /api/v1/settings/{scope}/{key}'],fields:['system/project/user 继承','敏感值保持/替换/清空','schema 校验','版本回滚']},
 {g:'身份与平台',n:'审计中心',r:'/admin/audit',f:['US-027'],role:'platform_admin / project admin',a:'导出审计',api:['GET /api/v1/audit-records','POST /api/v1/audit-record-exports'],fields:['时间/actor/action/target','correlationId','metadata 脱敏','追加写不可编辑']},
 {g:'项目',n:'项目中心',r:'/projects',f:['US-001','US-002'],role:'成员',a:'创建项目',api:['POST /api/v1/projects','GET /api/v1/projects','POST /api/v1/projects/{id}/episodes'],fields:['名称/类型/描述','第1集原子初始化','幂等创建','软删与筛选']},
 {g:'项目',n:'成员与权限',r:'/projects/{id}/settings/members',f:['CAP-001'],role:'owner / admin',a:'添加成员',api:['POST /api/v1/projects/{id}/members','PUT /api/v1/projects/{id}/members/{userId}','POST /api/v1/projects/{id}/ownership-transfers'],fields:['角色与 allow/deny','最终权限解释','唯一 owner','移除前责任转派']},
 {g:'项目',n:'表现规格',r:'/projects/{id}/settings/presentation',f:['MANGA-001'],role:'owner / director',a:'影响分析并保存',api:['GET /api/v1/projects/{id}/presentation-spec','POST /api/v1/projects/{id}/presentation-spec-impact','PUT /api/v1/projects/{id}/presentation-spec'],fields:['9:16/16:9/custom','主体/文字安全区','平台遮挡区','已审 Shot 版本化']},
 {g:'创作',n:'剧本编辑器',r:'/projects/{id}/scripts/{scriptId}',f:['US-003','US-004'],role:'writer',a:'发布剧本版本',api:['POST /api/v1/scripts/{id}/edit-lock','PUT /api/v1/scripts/{id}/draft','POST /api/v1/scripts/{id}/publish','POST /api/v1/scripts/{id}/analysis-jobs'],fields:['30分钟编辑租约','结构化内容与批注','版本对比/回退','分析 stale 提示']},
 {g:'创作',n:'分镜板',r:'/projects/{id}/storyboards/{storyboardId}',f:['US-005','US-006'],role:'storyboard_director',a:'创建 Shot',api:['POST /api/v1/storyboards/{id}/shots','PUT /api/v1/storyboards/{id}/shot-order','POST /api/v1/storyboards/{id}/shot-suggestion-jobs'],fields:['原子创建与排序','批量时长','AI 建议待确认','并发冲突重放']},
 {g:'创作',n:'漫剧导演台',r:'/shots/{shotId}',f:['MANGA-002','MANGA-003','MANGA-004','MANGA-005','MANGA-006','MANGA-008'],role:'storyboard_director',a:'预检并送审',api:['POST /api/v1/shots/{id}/visual-layers','POST /api/v1/shots/{id}/text-overlays','POST /api/v1/shots/{id}/comic-effects','POST /api/v1/shots/{id}/motion-cues','POST /api/v1/shots/{id}/review-submissions'],fields:['图层树与画布','气泡/旁白/拟声词','特效与光敏风险','MotionCue 时间轴','不可变快照']},
 {g:'资产',n:'角色/场景/道具工厂',r:'/characters · /scenes · /props',f:['US-007','US-008'],role:'artist',a:'创建资产草稿',api:['POST /api/v1/projects/{projectId}/characters','POST /api/v1/projects/{projectId}/scenes','POST /api/v1/projects/{projectId}/props'],fields:['类型化字段 schema','多视图与主图','来源与授权','不可变发布版本']},
 {g:'资产',n:'音频中心',r:'/projects/{id}/audio',f:['US-013'],role:'voice_actor / editor',a:'上传 / 生成音频',api:['POST /api/v1/projects/{id}/audio-assets','POST /api/v1/audio-generation-jobs','POST /api/v1/audio-assets/{id}/publish'],fields:['dialogue/voiceover/music/sfx','波形/响度/授权','候选到发布','影响分析']},
 {g:'AI治理',n:'模型中心',r:'/models',f:['CAP-002'],role:'ai_admin',a:'新增模型配置',api:['POST /api/v1/model-configs','POST /api/v1/model-configs/{id}/connection-tests','POST /api/v1/model-configs/{id}/activate'],fields:['Provider 与能力','凭据引用不回显','计价和限制','默认场景路由']},
 {g:'AI治理',n:'Prompt 中心',r:'/prompt-templates',f:['US-PM-001'],role:'ai_admin',a:'创建 Prompt 模板',api:['POST /api/v1/prompt-templates','POST /api/v1/prompt-templates/{id}/validate','POST /api/v1/prompt-templates/{id}/publish'],fields:['变量/输出 schema','敏感变量掩码','兼容模型能力','不可变版本']},
 {g:'AI治理',n:'Pipeline 模板',r:'/pipeline-templates',f:['CAP-003'],role:'ai_admin',a:'创建模板',api:['POST /api/v1/pipeline-templates','POST /api/v1/pipeline-templates/{id}/validate','POST /api/v1/pipeline-templates/{id}/publish'],fields:['节点/边/schema','环检测','人工门与预算','版本固定']},
 {g:'AI治理',n:'AI 任务队列',r:'/ai-tasks',f:['CAP-006','US-009','US-011'],role:'operator / creator',a:'批量操作',api:['GET /api/v1/ai-tasks','POST /api/v1/ai-tasks/{id}/cancel','POST /api/v1/ai-tasks/{id}/retry'],fields:['状态/Provider/耗时筛选','attempt 与输入快照','取消/重试规则','unknown_result 人工接管']},
 {g:'治理',n:'项目预算',r:'/projects/{id}/settings/budget',f:['CAP-007'],role:'owner / producer',a:'保存预算策略',api:['GET /api/v1/projects/{id}/budget','PUT /api/v1/projects/{id}/budget','POST /api/v1/projects/{id}/budget/reconciliation-runs'],fields:['软阈值/硬上限','预估/预占/结算','并发防穿透','每日对账']},
 {g:'治理',n:'质量规则',r:'/quality/rule-sets',f:['CAP-008'],role:'quality_admin',a:'发布规则版本',api:['POST /api/v1/quality-rule-sets','POST /api/v1/quality-rule-sets/{id}/sample-runs','POST /api/v1/quality-rule-sets/{id}/publish'],fields:['规则 schema/严重度','mandatory 保护','样本命中差异','项目策略版本']},
 {g:'治理',n:'质检中心',r:'/quality/reports',f:['MANGA-007'],role:'reviewer / artist',a:'运行质检',api:['POST /api/v1/qc-reports','GET /api/v1/qc-reports/{id}','POST /api/v1/qc-reports/{id}/waivers'],fields:['问题定位 Shot/层/时间','规则版本','超时/重试/接管','豁免留痕']},
 {g:'审核',n:'审核中心',r:'/reviews',f:['US-010','US-012','US-016'],role:'reviewer',a:'领取 / 决策',api:['GET /api/v1/reviews','POST /api/v1/reviews/{id}/comments','POST /api/v1/reviews/{id}/decisions'],fields:['图片/视频/成片目标','时间码评论','禁止自审','成片两级分离']},
 {g:'后期',n:'剪辑中心',r:'/edit-projects/{id}',f:['US-014','US-015','US-021'],role:'editor',a:'保存工程 / 渲染',api:['PUT /api/v1/edit-projects/{id}/timeline','POST /api/v1/edit-projects/{id}/render-precheck','POST /api/v1/edit-projects/{id}/render-jobs'],fields:['视频/音频/字幕多轨','Clip 源版本与快照','撤销/重做','冻结版本渲染']},
 {g:'发布',n:'发布准备',r:'/publish',f:['US-017'],role:'publisher',a:'创建发布计划',api:['POST /api/v1/publish-plans','POST /api/v1/publish-plans/{id}/precheck','POST /api/v1/publish-plans/{id}/execute'],fields:['平台独立计划','账号凭据引用','限制/版权预检','未知结果先对账']},
 {g:'协作',n:'任务/问题/里程碑',r:'/work-items',f:['US-018','US-019','US-020'],role:'成员',a:'创建工作项',api:['POST /api/v1/projects/{id}/work-items','POST /api/v1/work-items/{id}/transitions'],fields:['类型化状态机','负责人/截止时间','验证职责分离','事件去重']},
 {g:'数据',n:'数据集与统计',r:'/data-center',f:['CAP-004','US-DS-001'],role:'data_admin / member',a:'导入数据集 / 导出指标',api:['POST /api/v1/datasets','POST /api/v1/datasets/{id}/imports','GET /api/v1/metrics/project-overview'],fields:['授权/分类/版本','扫描与 staging','指标口径/watermark','项目权限裁剪']},
 {g:'生命周期',n:'统一回收站',r:'/projects/{id}/recycle-bin',f:['US-025'],role:'owner / admin',a:'生成恢复计划',api:['GET /api/v1/recycle-bin','POST /api/v1/recycle-bin/restore-plans','POST /api/v1/recycle-bin/restores'],fields:['依赖与到期摘要','名称/父对象冲突','法务冻结','永久删除重认证']},
 {g:'生命周期',n:'项目导入导出',r:'/projects/{id}/transfer',f:['US-028'],role:'project admin',a:'导出 / 上传项目包',api:['POST /api/v1/project-exports','POST /api/v1/project-imports/plans','POST /api/v1/project-imports/{id}/confirm'],fields:['manifest/schemaVersion/hash','扫描与预检','create_new/merge','原子写入与报告']},
 {g:'生命周期',n:'备份与恢复',r:'/admin/backups',f:['US-029'],role:'platform_admin',a:'创建备份 / 恢复计划',api:['POST /api/v1/admin/backups','POST /api/v1/admin/backups/{id}/verify','POST /api/v1/admin/restore-plans'],fields:['数据库/媒体/配置/位点','RPO/RTO','双人批准/重新认证','隔离恢复与回切']},
 {g:'助手',n:'AI 对话与创意工作室',r:'/assistant · /studio',f:['CAP-005'],role:'成员',a:'发送消息',api:['POST /api/v1/conversations','POST /api/v1/conversations/{id}/messages','POST /api/v1/messages/{id}/regenerations'],fields:['SSE 流式/停止','刷新恢复','重新生成 sibling','生成任务只保存引用']}
];
const stateMessages={loading:'首次加载：显示与最终布局接近的 Skeleton，禁止展示伪造业务数据。',empty:'空状态：解释为空原因；有权限时只展示一个主操作。',ready:'Ready：展示真实数据、最后更新时间、作用域和允许的操作。',forbidden:'403：保留页面上下文，解释缺少权限，敏感字段不渲染。',conflict:'409：保留本地输入，展示最新版本，允许比较后重新应用，禁止静默覆盖。',error:'失败：显示稳定错误码、traceId 和可重试性；已有数据不清空。'};
let current=0,state='ready';
const $=id=>document.getElementById(id);
function renderNav(filter=''){const q=filter.toLowerCase();$('nav').innerHTML=pages.map((p,i)=>({p,i})).filter(x=>(x.p.n+x.p.f.join(' ')+x.p.g).toLowerCase().includes(q)).map(({p,i})=>`<button class="${i===current?'active':''}" data-index="${i}">${p.g} · ${p.n}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{current=Number(b.dataset.index);state='ready';render()})}
function render(){const p=pages[current];$('route').textContent=p.r;$('title').textContent=p.n;$('primary').textContent=p.a;$('chips').innerHTML=[...p.f,p.role].map(x=>`<span class="chip">${x}</span>`).join('');$('mainHeading').textContent=state==='ready'?'页面工作区':`状态预览 · ${state}`;$('mainContent').innerHTML=state==='ready'?`<div class="canvas"><div class="safe">${p.n}<br><small>内容区 / 编辑器 / 列表</small></div></div>`:`<div class="canvas">${stateMessages[state]}</div>`;$('fields').innerHTML=p.fields.map((x,i)=>`<div class="row"><div class="label">${String(i+1).padStart(2,'0')}</div><div class="value">${x}</div></div>`).join('');$('apis').innerHTML=`<table class="table"><thead><tr><th>Method + Path</th></tr></thead><tbody>${p.api.map(x=>`<tr><td><code>${x}</code></td></tr>`).join('')}</tbody></table>`;$('checks').innerHTML=`<div class="row"><div class="label">角色</div><div class="value">${p.role}</div></div><div class="row"><div class="label">功能</div><div class="value">${p.f.join(', ')}</div></div><div class="row"><div class="label">状态</div><div class="value"><span class="badge">${state}</span></div></div><div class="row"><div class="label">门禁</div><div class="value">权限、幂等、并发、错误、审计、测试</div></div>`;const notice=$('notice');notice.className=`notice ${state} ${state==='ready'?'':'show'}`;notice.textContent=stateMessages[state];document.querySelectorAll('.statebar button').forEach(b=>b.classList.toggle('active',b.dataset.state===state));renderNav($('search').value)}
$('search').oninput=e=>renderNav(e.target.value);document.querySelectorAll('.statebar button').forEach(b=>b.onclick=()=>{state=b.dataset.state;render()});render();
</script>
</body>
</html>
